name: Unit Tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      # gold and silver each have their own `utils` package and must be
      # run as separate pytest invocations -- see
      # src/gold/tests/conftest.py for why.
      - name: Run gold unit tests
        run: pytest src/gold/tests -v

      - name: Run silver unit tests
        run: pytest src/silver/tests -v
